name: Allium Mesh (retired)
description: Retired and switched off. Uninstall it; for remote access to Home Assistant, install "Allium Connect (Home Node)".
slug: allium-mesh
url: https://github.com/allium-network/home-assistant-addon-connect
version: 0.3.3
# FINAL release. 0.3.3 runs nothing: no Snowflake proxy, no Tor, no panel. It
# prints a retirement notice and exits, so an install that takes this update
# stops relaying. The version is frozen here; it no longer follows
# Mesh/PACKAGING_VERSION (see publish-ha-addons.sh).
stage: deprecated
arch:
  - amd64
  - aarch64
startup: once
boot: manual
init: true
options:
  monthly_cap_gb: 50
  allow_middle_node: false
  hidden_service:
    enabled: true
    port: 8123
  allium_connect_enabled: true
  allium_api_url: https://allium.network
  network_integrity_testing: false
  relay_contribute: false
schema:
  monthly_cap_gb: int(1,1000)
  allow_middle_node: bool
  hidden_service:
    enabled: bool
    port: int(1,65535)
  allium_connect_enabled: bool
  allium_api_url: str
  network_integrity_testing: bool
  relay_contribute: bool
